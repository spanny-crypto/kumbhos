distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.0: new enough to run on the JDK 25 in Android Studio's JBR
# (8.x fails with "Unsupported class file major version 69"), old enough to
# avoid the Gradle 9.6 removal of the internal API that AGP 8.13 still uses.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.0-bin.zip
# Default is 10s, which kept timing out mid-download on this connection.
networkTimeout=300000
retries=5
retryBackOffMs=2000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
